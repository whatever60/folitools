name: folitools
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.12,<3.14
  - pip
  - rust
  - gcc
  # Most runtime tools are intentionally not version-pinned so folitools can share
  # an environment with other bioinformatics software. Run `foli check` to
  # report the resolved versions and verify the command-line options we use.
  - fastp
  # cutadapt is installed from our fork via pip (see pyproject.toml); do not
  # bring in the PyPI/bioconda package here as it would shadow the fork.
  - samtools
  - bwa-mem2
  # Keep STAR aligned with the version used to build the shared genome index.
  - star=2.7.11b
  - seqkit
  - fastqc
  - subread
  - sambamba
  - pigz
  - scanpy
  - rpy2
  - r-base>=4
  - r-essentials
  - r-irkernel
  - r-biocmanager  # For installing non-conda R packages
  - r-devtools  # For installing non-conda R packages
  - bioconductor-deseq2
  - bioconductor-sva
  - bioconductor-edgeR
  - bioconductor-limma
  - bioconductor-batchqc
  - bioconductor-toast  # dependency for MuSiC
  - r-rcurl  # dependency for BayesPrism
  - autogenes
  - xbioc  # dependency for SCDC
  - r-bisquerna
  # - r-bseqsc  # Dependencies too old
  - bioconductor-deconrnaseq
  - r-dwls
